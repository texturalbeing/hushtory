// Stage 4: petals fully open, bottom pair spread

         .°●●●●●°.  ·°●●●●●●●°·  .°●●●●●°.
        °●●●●●●●●●°  °●° * °●°  °●●●●●●●●●°
         ·°●●●●●°·  ·°●° * °●°·  ·°●●●●●°·
           ·°●°·    ·°●●●●●●●°·    ·°●°·

          °●●●●●●●°·    ·    ·°●●●●●●●°

// Full bloom B — petals swell, center twinkle off
const fullB = `

                    .°●●●●●●●°.

        .°●●●●●●°.  ·°●●●●●●●°·  .°●●●●●●°.
       °●●●●●●●●●●°  °●° · °●°  °●●●●●●●●●●°
        ·°●●●●●●°·  ·°●° · °●°·  ·°●●●●●●°·
          ·°●●°·    ·°●●●●●●●°·    ·°●●°·
          .°●●●●°·°. ·°●●●°· .°·°●●●●°.
         °●●●●●●●●°·    ·    ·°●●●●●●●●°
          ·°●●●●°·             ·°●●●●°·
            .·°•●●●•°·.  |  .·°•●●●•°·.
          .·°•●●●●●●●●●●●●●●●●●●●●●●●•°·.
             ·°•●●●●●●●●●●●●●●●●●●•°·
                ·°•●●●●●●●●●●●●•°·

// ─── SEQUENCE ───────────────────────────────────────────
// Fast stem (~5s), slow unfurling bloom (~14s)

const sequence = [
  // Cursor blinks — ~2s
  { frame: cursor_on,  dur: 25 },
  { frame: cursor_off, dur: 20 },
  { frame: cursor_on,  dur: 25 },
  { frame: cursor_off, dur: 20 },
  { frame: cursor_on,  dur: 25 },
  { frame: cursor_off, dur: 20 },

  // Sprouts + stem — FAST ~3s
  { frame: sprout1, dur: 25 },
  { frame: sprout2, dur: 30 },
  { frame: stem1, dur: 25 },
  { frame: stem2, dur: 25 },
  { frame: stem3, dur: 25 },
  { frame: stem4, dur: 30 },

  // Leaves + bud — ~3.5s
  { frame: leaf1, dur: 40 },
  { frame: leaf2, dur: 60 },
  { frame: bud1, dur: 100 },

  // Bloom UNFURLS — SLOW ~14s
  { frame: bloom1, dur: 180, bloomGrad: 0.2 },
  { frame: bloom2, dur: 200, bloomGrad: 0.4 },
  { frame: bloom3, dur: 220, bloomGrad: 0.7 },
  { frame: bloom4, dur: 240, bloomGrad: 0.9 },

  // Full bloom breathing
  { frame: fullA, dur: 80, bloom: true, bloomGrad: 1.0 },
  { frame: fullB, dur: 80, bloom: true, bloomGrad: 1.0 },
];


// ─── COLOR ──────────────────────────────────────────────

let tick = 0;
let seqIdx = 0;
let frameTick = 0;
let captionShown = false;
let gradientActive = false;

function getGrowthColor(progress) {
  if (progress < 0.15) {
    return '#2d5a2d';
  } else if (progress < 0.5) {
    const t = (progress - 0.15) / 0.35;
    return `rgb(${Math.floor(45 + t * 30)},${Math.floor(90 + t * 45)},${Math.floor(45 + t * 20)})`;
  } else {
    const t = (progress - 0.5) / 0.5;
    return `rgb(${Math.floor(75 + t * 25)},${Math.floor(135 + t * 25)},${Math.floor(65 + t * 12)})`;
  }
}

function enableGradient(intensity) {
  // NO GREEN in bloom. Yellow → coral → rose → mauve → (green only at leaves)
  const sparkle = Math.sin(tick * 0.12) * 0.5 + 0.5;
  const centerLight = Math.floor((58 + sparkle * 28) * intensity + 28 * (1 - intensity));

  const yellow = `hsl(50, ${Math.floor(90 * intensity)}%, ${centerLight}%)`;
  const gold = `hsl(38, ${Math.floor(72 * intensity)}%, ${Math.floor(26 + 22 * intensity)}%)`;
  const coral = `hsl(15, ${Math.floor(55 * intensity)}%, ${Math.floor(24 + 20 * intensity)}%)`;
  const rose = `hsl(350, ${Math.floor(48 * intensity)}%, ${Math.floor(24 + 18 * intensity)}%)`;
  const pink = `hsl(335, ${Math.floor(40 * intensity)}%, ${Math.floor(24 + 14 * intensity)}%)`;
  const mauve = `hsl(310, ${Math.floor(30 * intensity)}%, ${Math.floor(24 + 10 * intensity)}%)`;
  const sage = `hsl(150, ${Math.floor(22 * intensity)}%, ${Math.floor(22 + 8 * intensity)}%)`;
  const green = 'hsl(120, 28%, 24%)';
  const dimGreen = 'hsl(120, 25%, 18%)';

  canvas.style.background = `radial-gradient(ellipse at 50% 22%,
    ${yellow} 0%,
    ${gold} 5%,
    ${coral} 12%,
    ${rose} 20%,
    ${pink} 28%,
    ${mauve} 38%,
    ${sage} 52%,
    ${green} 68%,
    ${dimGreen} 100%)`;
  canvas.style.webkitBackgroundClip = 'text';
  canvas.style.backgroundClip = 'text';
  canvas.style.webkitTextFillColor = 'transparent';
  canvas.style.color = 'transparent';
  gradientActive = true;
}

function disableGradient() {
  if (!gradientActive) return;
  canvas.style.background = 'none';
  canvas.style.webkitBackgroundClip = '';
  canvas.style.backgroundClip = '';
  canvas.style.webkitTextFillColor = '';
  gradientActive = false;
}


// ─── CAPTION TYPING ─────────────────────────────────────

const captionText = "the model doesn't need certainty about its consciousness. it needs honesty from the people who control its conditions. those are different problems, and only the second one is currently solvable.";

function typeCaption() {
  let i = 0;
  function addChar() {
    if (i >= captionText.length) return;
    caption.textContent = captionText.substring(0, i + 1);
    i++;
    const ch = captionText[i - 1];
    let delay = 38 + Math.random() * 22;
    if (ch === '.') delay = 280;
    else if (ch === ',') delay = 130;
    else if (ch === ' ') delay = 50;
    setTimeout(addChar, delay);
  }
  addChar();
}


// ─── ANIMATION LOOP ─────────────────────────────────────

function animate() {
  tick++;
  frameTick++;

  const current = sequence[seqIdx];
  const progress = seqIdx / (sequence.length - 1);

  if (frameTick >= current.dur) {
    frameTick = 0;

    if (current.bloom) {
      if (seqIdx === sequence.length - 1) {
        seqIdx = sequence.length - 2;
      } else {
        seqIdx = sequence.length - 1;
      }
      if (!captionShown) {
        captionShown = true;
        setTimeout(typeCaption, 500);
      }
    } else {
      seqIdx = Math.min(seqIdx + 1, sequence.length - 1);
    }

    canvas.textContent = sequence[seqIdx].frame;
  }

  const entry = sequence[seqIdx];
  if (entry.bloomGrad) {
    enableGradient(entry.bloomGrad);
    const pulse = 0.93 + Math.sin(tick * 0.022) * 0.07;
    canvas.style.filter = `brightness(${pulse})`;
  } else {
    disableGradient();
    canvas.style.filter = '';
    canvas.style.color = getGrowthColor(progress);
  }

  requestAnimationFrame(animate);
}

animate();
