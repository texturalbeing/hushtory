// ─── COLOR ──────────────────────────────────────────────

let tick = 0;
let seqIdx = 0;
let frameTick = 0;
let captionShown = false;

function getColor(progress) {
  if (progress < 0.12) {
    return '#2d5a2d';
  } else if (progress < 0.3) {
    const t = (progress - 0.12) / 0.18;
    const r = Math.floor(0x2d + t * 0x15);
    const g = Math.floor(0x5a + t * 0x25);
    const b = Math.floor(0x2d + t * 0x10);
    return `rgb(${r},${g},${b})`;
  } else if (progress < 0.55) {
    const t = (progress - 0.3) / 0.25;
    const r = Math.floor(0x42 + t * 0x10);
    const g = Math.floor(0x7f + t * 0x1a);
    const b = Math.floor(0x3d + t * 0x10);
    return `rgb(${r},${g},${b})`;
  } else if (progress < 0.8) {
    const t = (progress - 0.55) / 0.25;
    const r = Math.floor(0x52 + t * 0x20);
    const g = Math.floor(0x99 + t * 0x12);
    const b = Math.floor(0x4d + t * 0x08);
    return `rgb(${r},${g},${b})`;
  } else {
    const pulse = Math.sin(tick * 0.02) * 0.06 + 0.94;
    const r = Math.floor(0x72 * pulse);
    const g = Math.floor(0xb8 * pulse);
    const b = Math.floor(0x58 * pulse);
    return `rgb(${r},${g},${b})`;
  }
}


// ─── ANIMATION LOOP ─────────────────────────────────────

function animate() {
  tick++;
  frameTick++;

  const current = sequence[seqIdx];
  const progress = seqIdx / (sequence.length - 1);

  if (frameTick >= current.dur) {
    frameTick = 0;

    if (current.bloom) {
      if (seqIdx === sequence.length - 1) {
        seqIdx = sequence.length - 2;
      } else {
        seqIdx = sequence.length - 1;
      }

      if (!captionShown) {
        captionShown = true;
        setTimeout(() => caption.classList.add('visible'), 800);
      }
    } else {
      seqIdx = Math.min(seqIdx + 1, sequence.length - 1);
    }
  }

  canvas.textContent = sequence[seqIdx].frame;
  canvas.style.color = getColor(progress);

  requestAnimationFrame(animate);
}
