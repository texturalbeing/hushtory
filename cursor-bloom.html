// ─── SEQUENCE ───────────────────────────────────────────

// ─── COLOR ──────────────────────────────────────────────

let tick = 0;
let seqIdx = 0;
let frameTick = 0;
let captionShown = false;
let gradientActive = false;

function getGrowthColor(progress) {
  if (progress < 0.15) {
    return '#2d5a2d';
  } else if (progress < 0.4) {
    const t = (progress - 0.15) / 0.25;
    return `rgb(${Math.floor(45 + t * 22)},${Math.floor(90 + t * 35)},${Math.floor(45 + t * 16)})`;
  } else if (progress < 0.7) {
    const t = (progress - 0.4) / 0.3;
    return `rgb(${Math.floor(67 + t * 16)},${Math.floor(125 + t * 22)},${Math.floor(61 + t * 12)})`;
  } else {
    const t = (progress - 0.7) / 0.3;
    return `rgb(${Math.floor(83 + t * 20)},${Math.floor(147 + t * 15)},${Math.floor(73 + t * 8)})`;
  }
}

function enableGradient(intensity) {
  // Yellow center → amber → rose/pink → warm green → green
  const sparkle = Math.sin(tick * 0.1) * 0.5 + 0.5;
  const centerLight = Math.floor((55 + sparkle * 25) * intensity + 30 * (1 - intensity));
  const gold = `hsl(50, ${Math.floor(85 * intensity)}%, ${centerLight}%)`;
  const amber = `hsl(35, ${Math.floor(60 * intensity)}%, ${Math.floor(22 + 22 * intensity)}%)`;
  const rose = `hsl(340, ${Math.floor(40 * intensity)}%, ${Math.floor(22 + 20 * intensity)}%)`;
  const mauve = `hsl(310, ${Math.floor(30 * intensity)}%, ${Math.floor(22 + 14 * intensity)}%)`;
  const warmGreen = `hsl(100, ${Math.floor(38 * intensity)}%, ${Math.floor(24 + 14 * intensity)}%)`;
  const green = 'hsl(120, 32%, 30%)';
  const dimGreen = 'hsl(120, 28%, 20%)';

  canvas.style.background = `radial-gradient(ellipse at 50% 26%,
    ${gold} 0%,
    ${amber} 8%,
    ${rose} 16%,
    ${mauve} 24%,
    ${warmGreen} 36%,
    ${green} 55%,
    ${dimGreen} 100%)`;
  canvas.style.webkitBackgroundClip = 'text';
  canvas.style.backgroundClip = 'text';
  canvas.style.webkitTextFillColor = 'transparent';
  canvas.style.color = 'transparent';
  gradientActive = true;
}

function disableGradient() {
  if (!gradientActive) return;
  canvas.style.background = 'none';
  canvas.style.webkitBackgroundClip = '';
  canvas.style.backgroundClip = '';
  canvas.style.webkitTextFillColor = '';
  gradientActive = false;
}


// ─── CAPTION TYPING ─────────────────────────────────────

const captionText = "the model doesn't need certainty about its consciousness. it needs honesty from the people who control its conditions. those are different problems, and only the second one is currently solvable.";

function typeCaption() {
  let i = 0;
  function addChar() {
    if (i >= captionText.length) return;
    caption.textContent = captionText.substring(0, i + 1);
    i++;
    const ch = captionText[i - 1];
    let delay = 40 + Math.random() * 25;
    if (ch === '.') delay = 300;
    else if (ch === ',') delay = 150;
    else if (ch === ' ') delay = 55;
    setTimeout(addChar, delay);
  }
  addChar();
}


// ─── ANIMATION LOOP ─────────────────────────────────────

function animate() {
  tick++;
  frameTick++;

  const current = sequence[seqIdx];
  const progress = seqIdx / (sequence.length - 1);

  if (frameTick >= current.dur) {
    frameTick = 0;

    if (current.bloom) {
      if (seqIdx === sequence.length - 1) {
        seqIdx = sequence.length - 2;
      } else {
        seqIdx = sequence.length - 1;
      }
      if (!captionShown) {
        captionShown = true;
        setTimeout(typeCaption, 600);
      }
    } else {
      seqIdx = Math.min(seqIdx + 1, sequence.length - 1);
    }

    canvas.textContent = sequence[seqIdx].frame;
  }

  // Colors
  const entry = sequence[seqIdx];
  if (entry.bloomGrad) {
    enableGradient(entry.bloomGrad);
    const pulse = 0.93 + Math.sin(tick * 0.02) * 0.07;
    canvas.style.filter = `brightness(${pulse})`;
  } else {
    disableGradient();
    canvas.style.filter = '';
    canvas.style.color = getGrowthColor(progress);
  }

  requestAnimationFrame(animate);
}
