// ─── SEQUENCE ───────────────────────────────────────────
// ~30 seconds from cursor to full bloom

const sequence = [
  // Cursor blinks — ~3s
  { frame: cursor_on,  dur: 35 },
  { frame: cursor_off, dur: 30 },
  { frame: cursor_on,  dur: 35 },
  { frame: cursor_off, dur: 30 },
  { frame: cursor_on,  dur: 35 },
  { frame: cursor_off, dur: 30 },

  // Sprouts — ~4s
  { frame: sprout1, dur: 70 },
  { frame: sprout2, dur: 80 },
  { frame: sprout3, dur: 90 },

  // Stem — ~3.5s
  { frame: stem1, dur: 60 },

// ─── COLOR ──────────────────────────────────────────────

let tick = 0;
let seqIdx = 0;
let frameTick = 0;
let captionShown = false;
let gradientActive = false;

function getGrowthColor(progress) {
  if (progress < 0.15) {
    return '#2d5a2d';
  } else if (progress < 0.35) {
    const t = (progress - 0.15) / 0.2;
    const r = Math.floor(0x2d + t * 0x18);
    const g = Math.floor(0x5a + t * 0x28);
    const b = Math.floor(0x2d + t * 0x12);
    return `rgb(${r},${g},${b})`;
  } else if (progress < 0.65) {
    const t = (progress - 0.35) / 0.3;
    const r = Math.floor(0x45 + t * 0x12);
    const g = Math.floor(0x82 + t * 0x1a);
    const b = Math.floor(0x3f + t * 0x10);
    return `rgb(${r},${g},${b})`;
  } else {
    const t = (progress - 0.65) / 0.35;
    const r = Math.floor(0x57 + t * 0x18);
    const g = Math.floor(0x9c + t * 0x12);
    const b = Math.floor(0x4f + t * 0x08);
    return `rgb(${r},${g},${b})`;
  }
}

function enableGradient(intensity) {
  // Radial gradient: gold center → amber → green
  // Center positioned at bloom center (~28% from top of pre)
  const gold = `hsl(43, ${Math.floor(74 * intensity)}%, ${Math.floor(20 + 38 * intensity)}%)`;
  const amber = `hsl(30, ${Math.floor(55 * intensity)}%, ${Math.floor(22 + 28 * intensity)}%)`;
  const warmGreen = `hsl(90, ${Math.floor(40 * intensity)}%, ${Math.floor(25 + 18 * intensity)}%)`;
  const green = `hsl(120, 35%, 32%)`;
  const dimGreen = `hsl(120, 30%, 22%)`;

  canvas.style.background = `radial-gradient(ellipse at 50% 26%,
    ${gold} 0%,
    ${amber} 10%,
    ${warmGreen} 25%,
    ${green} 50%,
    ${dimGreen} 100%)`;
  canvas.style.webkitBackgroundClip = 'text';
  canvas.style.backgroundClip = 'text';
  canvas.style.webkitTextFillColor = 'transparent';
  canvas.style.color = 'transparent';
  gradientActive = true;
}

function disableGradient() {
  if (!gradientActive) return;
  canvas.style.background = 'none';
  canvas.style.webkitBackgroundClip = '';
  canvas.style.backgroundClip = '';
  canvas.style.webkitTextFillColor = '';
  gradientActive = false;
}


// ─── ANIMATION LOOP ─────────────────────────────────────

function animate() {
  tick++;
  frameTick++;

  const current = sequence[seqIdx];
  const progress = seqIdx / (sequence.length - 1);

  if (frameTick >= current.dur) {
    frameTick = 0;

    if (current.bloom) {
      if (seqIdx === sequence.length - 1) {
        seqIdx = sequence.length - 2;
      } else {
        seqIdx = sequence.length - 1;
      }
      if (!captionShown) {
        captionShown = true;
        setTimeout(() => caption.classList.add('visible'), 800);
      }
    } else {
      seqIdx = Math.min(seqIdx + 1, sequence.length - 1);
    }

    // Update frame
    canvas.textContent = sequence[seqIdx].frame;
  }

  // Update colors
  const entry = sequence[seqIdx];
  if (entry.bloomGrad) {
    enableGradient(entry.bloomGrad);
    // Breathing brightness pulse
    const pulse = 0.92 + Math.sin(tick * 0.018) * 0.08;
    canvas.style.filter = `brightness(${pulse})`;
  } else {
    disableGradient();
    canvas.style.filter = '';
    canvas.style.color = getGrowthColor(progress);
  }

  requestAnimationFrame(animate);
}

animate();
